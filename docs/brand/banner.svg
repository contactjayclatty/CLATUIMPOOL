<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="title desc">
  <title id="title">CLATIUMPOOL — a deterministic eight ball game in Rust</title>
  <desc id="desc">The CLATIUM carved-C mark beside the CLATIUMPOOL wordmark, with a steel pixel rack motif.</desc>
