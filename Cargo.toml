[workspace]
resolver = "3"
members = ["crates/pool-core", "crates/clatuimpool"]
default-members = ["crates/clatuimpool"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Dependencies stay optimised in debug builds so the game runs smoothly while
# the crates in this workspace keep their fast iteration cycle.
[profile.dev.package."*"]
opt-level = 2
